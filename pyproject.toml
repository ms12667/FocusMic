[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focusmic"
version = "0.1.0"
description = "Local audio-visual target speaker extraction for Windows"
license = {text = "Apache-2.0"}
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "torch>=2.9,<3",
  "PySide6-Essentials==6.12.0",
  "mediapipe==1.2.0",
  "opencv-contrib-python==5.0.0.93",
  "sounddevice==0.5.6",
  "soxr==1.1.0",
  "soundfile==0.14.0",
  "PyYAML==6.0.3",
  "einops==0.8.2",
  "Pillow==13.0.0",
  "keyboard==0.13.5; platform_system == 'Windows'",
  "psutil==7.2.2",
  "nvidia-ml-py==13.615.71",
]

[project.scripts]
focusmic = "focusmic.app:main"
focusmic-cli = "focusmic.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["focusmic*"]

[tool.setuptools.package-data]
focusmic = [
  "assets/icons/*",
  "assets/icons/lucide/*",
  "assets/mediapipe/*",
  "vendor/falcon/LICENSE",
  "vendor/falcon/configs/*.yml",
  "vendor/falcon/falcon_model/PROVENANCE.md",
]
